name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'quick' || 'default' }} tier · Julia 1.12 · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMALLFLOATS_TIER: ${{ github.event_name == 'pull_request' && 'quick' || 'default' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run ${{ env.SMALLFLOATS_TIER }} verification tier
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  docs:
    name: HTML documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCS_PDF: skip
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build HTML documentation
        run: julia --project=docs docs/make.jl
      - name: Build locally browsable HTML documentation
        env:
          CI: "false"
          DOCS_BUILD_DIR: build-local
        run: julia --project=docs docs/make.jl
